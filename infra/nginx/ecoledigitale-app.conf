# Application EcoleDigitaleV2 — https://ecoledigitale-web.allianceconsultants.net  →  Next.js (127.0.0.1:3011) + API Fastify (127.0.0.1:8011)
#
# ⚠ Ce fichier REMPLACE /etc/nginx/sites-available/ecoledigitale-web (même nom d'hôte). Il reprend les routes de l'ancien vhost
#   « ecoledigitale » de l'application : /api/v1/ → 8011 et /health → 8011/api/v1/health (sans elles, la connexion et le contrôle de
#   santé du CI de l'application cassent). Le DNS et le certificat de cette adresse existent déjà (valide jusqu'au 2027-01-01).
#
# À installer à l'étape 2 de docs/cutover-domaine-marketing.md, AVANT de basculer l'adresse principale vers le site marketing :
#   sudo cp /etc/nginx/sites-available/ecoledigitale-web /etc/nginx/sites-available/ecoledigitale-web.bak-$(date +%F)
#   sudo cp ecoledigitale-app.conf /etc/nginx/sites-available/ecoledigitale-web
#   sudo nginx -t && sudo systemctl reload nginx
#
# Différence volontaire avec l'ancien vhost : la logique « tenant » (sous-domaines clients *.ecoledigitale…) n'est pas reprise —
# ces sous-domaines n'existent pas dans le DNS et l'expression ne correspondrait plus à ce nom d'hôte.

server {
    listen 80;
    listen [::]:80;
    server_name ecoledigitale-web.allianceconsultants.net;

    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name ecoledigitale-web.allianceconsultants.net;

    ssl_certificate     /etc/letsencrypt/live/ecoledigitale-web.allianceconsultants.net/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/ecoledigitale-web.allianceconsultants.net/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    client_max_body_size 50m;

    # API Fastify — seules les routes versionnées. /api/auth/* appartient à next-auth (conteneur Next.js).
    location /api/v1/ {
        proxy_pass http://127.0.0.1:8011;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
        proxy_cache_bypass $http_upgrade;
        proxy_redirect off;
    }

    location = /health {
        proxy_pass http://127.0.0.1:8011/api/v1/health;
        proxy_set_header Host $host;
        access_log off;
    }

    location /_next/static/ {
        proxy_pass http://127.0.0.1:3011;
        proxy_set_header Host $host;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location / {
        proxy_pass http://127.0.0.1:3011;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_cache_bypass $http_upgrade;
        proxy_redirect off;
    }
}
