# Site marketing EcoleDigitale — https://ecoledigitale.allianceconsultants.net  →  conteneur « ecoledigitale-site » (127.0.0.1:3021)
#
# ⚠ Ce fichier REMPLACE /etc/nginx/sites-available/ecoledigitale (même nom d'hôte) : un nom d'hôte ne peut appartenir qu'à UN
#   vhost. Ne l'installer qu'à l'étape « nginx » de docs/cutover-domaine-marketing.md, APRÈS avoir déplacé l'application ailleurs,
#   sinon l'application cesse de répondre sur cette adresse.
#
# Installation (sur le serveur, avec une sauvegarde de l'ancien vhost) :
#   sudo cp /etc/nginx/sites-available/ecoledigitale /etc/nginx/sites-available/ecoledigitale.bak-$(date +%F)
#   sudo cp ecoledigitale-site.conf /etc/nginx/sites-available/ecoledigitale
#   sudo nginx -t && sudo systemctl reload nginx
#
# Le certificat Let's Encrypt de l'adresse existe déjà (certbot le renouvelle seul). Les sous-domaines de clients de l'ancienne
# configuration (*.ecoledigitale…) n'existent pas dans le DNS aujourd'hui : ils ne sont pas repris ici.

server {
    listen 80;
    listen [::]:80;
    server_name ecoledigitale.allianceconsultants.net;

    # ACME http-01 challenge (certbot)
    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name ecoledigitale.allianceconsultants.net;

    ssl_certificate     /etc/letsencrypt/live/ecoledigitale.allianceconsultants.net/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/ecoledigitale.allianceconsultants.net/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    client_max_body_size 10m;

    location /_next/static/ {
        proxy_pass http://127.0.0.1:3021;
        proxy_set_header Host $host;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location / {
        proxy_pass http://127.0.0.1:3021;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_cache_bypass $http_upgrade;
        proxy_redirect off;
    }
}
