name: CI/CD EcoleDigitale

on:
  push:
    branches: ['main']
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  APP_NAME: ecoledigitale-web
  APP_DOMAIN: ecoledigitale-web.allianceconsultants.net
  DEPLOY_PATH: /home/deployer/apps/ecoledigitale-web
  APP_IMAGE: ghcr.io/bkourouma/ecoledigitale-web

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Login GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & Push App
        run: |
          docker build \
            -f infra/Dockerfile \
            --build-arg NEXT_PUBLIC_SITE_URL=https://ecoledigitale-web.allianceconsultants.net \
            --build-arg NEXT_PUBLIC_CONTACT_EMAIL=${{ secrets.NEXT_PUBLIC_CONTACT_EMAIL }} \
            --build-arg NEXT_PUBLIC_CONTACT_PHONE=${{ secrets.NEXT_PUBLIC_CONTACT_PHONE }} \
            --build-arg NEXT_PUBLIC_WHATSAPP_NUMBER=${{ secrets.NEXT_PUBLIC_WHATSAPP_NUMBER }} \
            --build-arg NEXT_PUBLIC_GOOGLE_APPS_SCRIPT_URL=${{ secrets.NEXT_PUBLIC_GOOGLE_APPS_SCRIPT_URL }} \
            -t ${{ env.APP_IMAGE }}:latest \
            -t ${{ env.APP_IMAGE }}:${{ github.sha }} \
            .
          docker push ${{ env.APP_IMAGE }}:latest
          docker push ${{ env.APP_IMAGE }}:${{ github.sha }}

  deploy:
    runs-on: [self-hosted, linux, x64, ecoledigitale-web]
    needs: [build]
    if: ${{ !cancelled() && needs.build.result == 'success' }}
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@v4

      - name: Login GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Deploy on self-hosted runner
        shell: bash
        run: |
          set -euo pipefail
          APP_DIR="${{ env.DEPLOY_PATH }}"
          mkdir -p "$APP_DIR/docker/nginx"
          cp docker-compose.prod.yml "$APP_DIR/docker-compose.prod.yml"
          cp docker/nginx/nginx.conf "$APP_DIR/docker/nginx/nginx.conf"
          cd "$APP_DIR"
          docker pull "${{ env.APP_IMAGE }}:latest"
          dc() {
            docker compose --env-file .env.production -f docker-compose.prod.yml "$@"
          }
          dc down 2>/dev/null || true
          dc up -d
          echo "Waiting for services to start..."
          sleep 10
          dc ps
          echo "--- Web logs (last 30 lines) ---"
          docker logs --tail 30 ecoledigitale-web 2>&1 || true
          docker image prune -f
