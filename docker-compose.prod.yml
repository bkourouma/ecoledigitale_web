services:
  web:
    image: ghcr.io/bkourouma/ecoledigitale-web:latest
    container_name: ecoledigitale-web
    restart: unless-stopped
    env_file: .env.production
    # Port hôte local → conteneur Next.js (PORT=3000 dans le Dockerfile)
    # Le nginx système (hôte) proxie https://... vers ce port.
    ports:
      - '127.0.0.1:3011:3000'
