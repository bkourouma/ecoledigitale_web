services:
  web:
    image: ghcr.io/bkourouma/ecoledigitale-web:latest
    container_name: ecoledigitale-web
    restart: unless-stopped
    # Variables runtime (secrets, non baked dans l'image)
    env_file: .env.production
    expose:
      - "3000"
    networks:
      - internal

  nginx:
    image: nginx:1.27-alpine
    container_name: ecoledigitale-nginx
    restart: unless-stopped
    # Port hôte 8082 → le proxy global du serveur route le sous-domaine vers ce port
    ports:
      - "8082:80"
    volumes:
      - ./docker/nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - web
    networks:
      - internal

networks:
  internal:
    driver: bridge
